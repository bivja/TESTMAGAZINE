<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTMAGAZIN — Интернет-магазин</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #fff; color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    
    .container { max-width: 1300px; margin: 0 auto; padding: 0 24px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* Шапка */
    header { border-bottom: 1px solid #eee; padding: 16px 0; position: sticky; top: 0; background: #fff; z-index: 100; }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: -1px; text-transform: uppercase; }
    .logo span { color: #e60000; }
    .nav-links { display: none; gap: 24px; font-size: 14px; font-weight: 500; }
    .nav-links a { cursor: pointer; transition: color 0.2s; }
    .nav-links a:hover { color: #e60000; }
    .cart-btn { border: 1px solid #000; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }

    /* Баннеры разделов (как у Lamoda) */
    .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 32px 0; }
    .category-card { position: relative; height: 200px; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .category-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .category-card:hover img { transform: scale(1.05); }
    .category-title { position: absolute; bottom: 16px; left: 16px; color: #fff; font-size: 20px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* Сетка товаров */
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding-bottom: 40px; }
    .product-card { background: #f9f9f9; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    
    .product-img { width: 100%; height: 250px; object-fit: cover; background: #eee; display: block; }
    
    .product-info { padding: 12px; }
    .product-brand { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .product-name { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .product-price { font-size: 16px; font-weight: 700; }

    /* Корзина */
    .cart-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); z-index: 200; transition: right 0.3s; padding: 24px; display: flex; flex-direction: column; }
    .cart-panel.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #eee; padding-bottom: 16px; }
    .cart-items { flex-grow: 1; overflow-y: auto; }
    .cart-item { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .cart-item-info { flex-grow: 1; font-size: 14px; }
    .cart-total { border-top: 1px solid #eee; padding-top: 16px; margin-top: 16px; font-size: 20px; font-weight: 700; text-align: right; }
    .checkout-btn { background: #e60000; color: #fff; border: none; padding: 16px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; }
    .close-cart { cursor: pointer; font-size: 24px; }

    @media (min-width: 768px) {
        .nav-links { display: flex; }
        .categories-grid { grid-template-columns: repeat(4, 1fr); }
        .products-grid { grid-template-columns: repeat(3, 1fr); }
        .product-img { height: 300px; }
    }
    @media (min-width: 1024px) {
        .products-grid { grid-template-columns: repeat(4, 1fr); }
    }
</style>
</head>
<body>

<header>
    <div class="container flex justify-between items-center">
        <div class="logo">TESTMAGAZIN<span>.</span></div>
        <div class="nav-links">
            <a onclick="filterAudience('women')">Женщинам</a>
            <a onclick="filterAudience('men')">Мужчинам</a>
            <a onclick="filterAudience('kids')">Детям</a>
            <a onclick="filterAudience('all')">Все товары</a>
        </div>
        <div class="cart-btn" onclick="toggleCart()">Корзина <span id="cartCount">0</span></div>
    </div>
</header>

<main class="container">
    <!-- Разделы как у Lamoda -->
    <div class="categories-grid">
        <div class="category-card" onclick="filterAudience('women')">
            <img src="https://images.pexels.com/photos/934063/pexels-photo-934063.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Женщинам">
            <div class="category-title">Женщинам</div>
        </div>
        <div class="category-card" onclick="filterAudience('men')">
            <img src="https://images.pexels.com/photos/1043474/pexels-photo-1043474.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Мужчинам">
            <div class="category-title">Мужчинам</div>
        </div>
        <div class="category-card" onclick="filterAudience('kids')">
            <img src="https://images.pexels.com/photos/35188/child-childrens-baby-children-s.jpg?auto=compress&cs=tinysrgb&w=600" alt="Детям">
            <div class="category-title">Детям</div>
        </div>
        <div class="category-card" onclick="filterAudience('all')">
            <img src="https://images.pexels.com/photos/1884581/pexels-photo-1884581.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Все товары">
            <div class="category-title">Все товары</div>
        </div>
    </div>

    <!-- Сетка товаров -->
    <div class="products-grid" id="productsGrid"></div>
</main>

<!-- Корзина -->
<div class="cart-panel" id="cartPanel">
    <div class="cart-header">
        <h2>Корзина</h2>
        <span class="close-cart" onclick="toggleCart()">&times;</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
    <button class="checkout-btn" onclick="alert('Заказ оформлен! (Демо)')">Оформить заказ</button>
</div>

<script>
    // Товары с реальными фото
    const allProducts = [
        {id: 1, name: 'Платье миди', category: 'Платья', audience: 'women', price: 4500, brand: 'ZARA', image: 'https://images.pexels.com/photos/1755428/pexels-photo-1755428.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 2, name: 'Джинсы широкие', category: 'Джинсы', audience: 'women', price: 3800, brand: 'Levis', image: 'https://images.pexels.com/photos/1082529/pexels-photo-1082529.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 3, name: 'Кроссовки белые', category: 'Обувь', audience: 'men', price: 7990, brand: 'Nike', image: 'https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 4, name: 'Сумка кожаная', category: 'Аксессуары', audience: 'women', price: 6200, brand: 'Mango', image: 'https://images.pexels.com/photos/1152077/pexels-photo-1152077.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 5, name: 'Худи оверсайз', category: 'Верхняя одежда', audience: 'kids', price: 3500, brand: 'H&M', image: 'https://images.pexels.com/photos/1183266/pexels-photo-1183266.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 6, name: 'Пальто шерстяное', category: 'Верхняя одежда', audience: 'women', price: 12500, brand: 'COS', image: 'https://images.pexels.com/photos/1183266/pexels-photo-1183266.jpeg?auto=compress&cs=tinysrgb&w=600'}
    ];

    let currentCategory = 'all';
    let currentAudience = 'all';
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        
        const filtered = allProducts.filter(p => {
            const matchCategory = currentCategory === 'all' || p.category === currentCategory;
            const matchAudience = currentAudience === 'all' || p.audience === currentAudience;
            return matchCategory && matchAudience;
        });

        filtered.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => addToCart(product.id);
            card.innerHTML = `
                <img src="${product.image}" alt="${product.name}" class="product-img">
                <div class="product-info">
                    <div class="product-brand">${product.brand}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} ₽</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(category) {
        currentCategory = category;
        renderProducts();
    }

    function filterAudience(audience) {
        currentAudience = audience;
        currentCategory = 'all'; 
        renderProducts();
    }

    function addToCart(productId) {
        const existing = cart.find(item => item.id === productId);
        if (existing) {
            existing.qty += 1;
        } else {
            const product = allProducts.find(p => p.id === productId);
            cart.push({ ...product, qty: 1 });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCart();
        toggleCart();
    }

    function updateCart() {
        const cartItems = document.getElementById('cartItems');
        cartItems.innerHTML = '';
        
        let totalQty = 0;
        let totalPrice = 0;

        cart.forEach(item => {
            totalQty += item.qty;
            totalPrice += item.price * item.qty;
            cartItems.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-info">
                        <div>${item.name}</div>
                        <div style="color: #888; font-size: 12px;">${item.qty} шт.</div>
                    </div>
                    <div>${(item.price * item.qty).toLocaleString()} ₽</div>
                </div>
            `;
        });

        document.getElementById('cartCount').innerText = totalQty;
        document.getElementById('cartTotal').innerText = totalPrice.toLocaleString();
    }

    function toggleCart() {
        document.getElementById('cartPanel').classList.toggle('open');
    }

    renderProducts();
    updateCart();
</script>

</body>
</html>
