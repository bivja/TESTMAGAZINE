<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTMAGAZIN — Интернет-магазин</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #fff; color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }
    
    .container { max-width: 1300px; margin: 0 auto; padding: 0 24px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    header { border-bottom: 1px solid #eee; padding: 16px 0; position: sticky; top: 0; background: #fff; z-index: 100; }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: -1px; text-transform: uppercase; }
    .logo span { color: #e60000; }
    .nav-links { display: none; gap: 24px; font-size: 14px; font-weight: 500; }
    .nav-links a { cursor: pointer; transition: color 0.2s; }
    .nav-links a:hover { color: #e60000; }
    .cart-btn { border: 1px solid #000; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; user-select: none; }

    .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 32px 0; }
    .category-card { position: relative; height: 200px; border-radius: 8px; overflow: hidden; cursor: pointer; background: #f4f4f4; display: flex; align-items: center; justify-content: center; }
    .category-card img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; transition: transform 0.3s; }
    .category-card:hover img { transform: scale(1.05); }
    .category-title { position: relative; z-index: 2; color: #fff; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.7); transition: color 0.3s; }
    
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding-bottom: 40px; }
    .product-card { background: #f9f9f9; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    
    .product-img {
        width: 100%; aspect-ratio: 3 / 4; height: auto;
        background: #e9e9e9; overflow: hidden;
        border-bottom: 1px solid #eee;
        display: flex; align-items: center; justify-content: center;
    }
    .product-img img {
        width: 100%; height: 100%; object-fit: cover; display: block;
        filter: saturate(0.95) contrast(1.02);
        loading: lazy;
    }
    
    .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-brand { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .product-name { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
    .product-price { font-size: 16px; font-weight: 700; }
    
    .add-to-cart-btn { 
        background: #000; color: #fff; border: none; 
        padding: 8px 12px; border-radius: 4px; 
        font-size: 12px; font-weight: 600; cursor: pointer; 
        transition: background 0.2s;
    }
    .add-to-cart-btn:hover { background: #e60000; }

    .cart-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: #fff; box-shadow: -5px 0 20px rgba(0,0,0,0.1); z-index: 200; transition: right 0.3s; padding: 24px; display: flex; flex-direction: column; }
    .cart-panel.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #eee; padding-bottom: 16px; }
    .cart-items { flex-grow: 1; overflow-y: auto; }
    .cart-item { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .cart-item .product-img { width: 60px; height: 80px; border-radius: 4px; border: none; }
    .cart-item-info { flex-grow: 1; font-size: 14px; }
    .cart-total { border-top: 1px solid #eee; padding-top: 16px; margin-top: 16px; font-size: 20px; font-weight: 700; text-align: right; }
    .checkout-btn { background: #e60000; color: #fff; border: none; padding: 16px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; }
    .close-cart { cursor: pointer; font-size: 24px; user-select: none; }

    @media (min-width: 768px) {
        .nav-links { display: flex; }
        .categories-grid { grid-template-columns: repeat(4, 1fr); }
        .products-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 1024px) {
        .products-grid { grid-template-columns: repeat(4, 1fr); }
    }
</style>
</head>
<body>

<header>
    <div class="container flex justify-between items-center">
        <div class="logo">TESTMAGAZIN<span>.</span></div>
        <div class="nav-links">
            <a onclick="filterAudience('women')">Женщинам</a>
            <a onclick="filterAudience('men')">Мужчинам</a>
            <a onclick="filterAudience('kids')">Детям</a>
            <a onclick="filterAudience('all')">Все товары</a>
        </div>
        <div class="cart-btn" onclick="toggleCart()">Корзина <span id="cartCount">0</span></div>
    </div>
</header>

<main class="container">
    <div class="categories-grid">
        <div class="category-card" onclick="filterAudience('women')">
            <img src="https://images.pexels.com/photos/7202800/pexels-photo-7202800.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Женщинам" loading="lazy">
            <div class="category-title">Женщинам</div>
        </div>
        <div class="category-card" onclick="filterAudience('men')">
            <img src="https://images.pexels.com/photos/31849224/pexels-photo-31849224.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Мужчинам" loading="lazy">
            <div class="category-title">Мужчинам</div>
        </div>
        <div class="category-card" onclick="filterAudience('kids')">
            <img src="https://images.pexels.com/photos/6261908/pexels-photo-6261908.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Детям" loading="lazy">
            <div class="category-title">Детям</div>
        </div>
        <div class="category-card" onclick="filterAudience('all')">
            <img src="https://images.pexels.com/photos/1884581/pexels-photo-1884581.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Все товары" loading="lazy">
            <div class="category-title">Все товары</div>
        </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</main>

<div class="cart-panel" id="cartPanel">
    <div class="cart-header">
        <h2>Корзина</h2>
        <span class="close-cart" onclick="toggleCart()">&times;</span>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
    <button class="checkout-btn" onclick="alert('Заказ оформлен! (Демо)')">Оформить заказ</button>
</div>

<script>
    const allProducts = [
        {id: 1, name: 'Платье миди', category: 'Платья', audience: 'women', price: 4500, brand: 'ZARA', 
         img: 'https://images.pexels.com/photos/18953353/pexels-photo-18953353.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 2, name: 'Джинсы широкие', category: 'Джинсы', audience: 'women', price: 3800, brand: 'Levis', 
         img: 'https://images.pexels.com/photos/29627103/pexels-photo-29627103.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 3, name: 'Сумка кожаная', category: 'Аксессуары', audience: 'women', price: 6200, brand: 'Mango', 
         img: 'https://images.pexels.com/photos/8502477/pexels-photo-8502477.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 4, name: 'Худи оверсайз', category: 'Верхняя одежда', audience: 'women', price: 3500, brand: 'H&M', 
         img: 'https://images.pexels.com/photos/16982942/pexels-photo-16982942.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 5, name: 'Кожаная куртка', category: 'Верхняя одежда', audience: 'women', price: 15500, brand: 'ZARA', 
         img: 'https://media.istockphoto.com/id/2161628082/photo/fashionable-beautiful-young-model-woman-in-vogue-sunglasses-in-stylish-black-leather-jacket.jpg?s=1024x1024&w=is&k=20&c=mWNvJa5Og8xEIWGcqHjDXNjM68h23rLu-U3myL9k1Z0='},
        {id: 6, name: 'Жилет вязаный', category: 'Верхняя одежда', audience: 'women', price: 3200, brand: 'Mango', 
         img: 'https://images.pexels.com/photos/9178845/pexels-photo-9178845.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 7, name: 'Юбка плиссе', category: 'Юбки', audience: 'women', price: 3900, brand: 'H&M', 
         img: 'https://images.pexels.com/photos/19451307/pexels-photo-19451307.jpeg?auto=compress&cs=tinysrgb&w=600'},
        
        {id: 8, name: 'Кроссовки мужские', category: 'Обувь', audience: 'men', price: 7990, brand: 'Nike', 
         img: 'https://images.pexels.com/photos/1477538/pexels-photo-1477538.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 9, name: 'Рубашка', category: 'Рубашки', audience: 'men', price: 4500, brand: 'ZARA', 
         img: 'https://images.pexels.com/photos/35415004/pexels-photo-35415004.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 10, name: 'Брюки', category: 'Брюки', audience: 'men', price: 5200, brand: 'Levis', 
         img: 'https://images.pexels.com/photos/9464625/pexels-photo-9464625.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 11, name: 'Куртка-бомбер', category: 'Верхняя одежда', audience: 'men', price: 8900, brand: 'Nike', 
         img: 'https://images.pexels.com/photos/2566899/pexels-photo-2566899.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 12, name: 'Рюкзак', category: 'Аксессуары', audience: 'men', price: 4100, brand: 'Nike', 
         img: 'https://images.pexels.com/photos/14039946/pexels-photo-14039946.jpeg?auto=compress&cs=tinysrgb&w=600'},
        
        {id: 13, name: 'Свитшот детский', category: 'Верхняя одежда', audience: 'kids', price: 2500, brand: 'H&M', 
         img: 'https://images.pexels.com/photos/5560015/pexels-photo-5560015.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 14, name: 'Комбинезон детский', category: 'Верхняя одежда', audience: 'kids', price: 3800, brand: 'ZARA', 
         img: 'https://images.pexels.com/photos/30435359/pexels-photo-30435359.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 15, name: 'Детская куртка', category: 'Верхняя одежда', audience: 'kids', price: 4500, brand: 'H&M', 
         img: 'https://images.pexels.com/photos/5788237/pexels-photo-5788237.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 16, name: 'Платье детское', category: 'Платья', audience: 'kids', price: 3200, brand: 'ZARA', 
         img: 'https://images.pexels.com/photos/28246503/pexels-photo-28246503.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 17, name: 'Кеды детские', category: 'Обувь', audience: 'kids', price: 2900, brand: 'Nike', 
         img: 'https://images.pexels.com/photos/29753638/pexels-photo-29753638.jpeg?auto=compress&cs=tinysrgb&w=600'},
        {id: 18, name: 'Детский рюкзак', category: 'Аксессуары', audience: 'kids', price: 2100, brand: 'Nike', 
         img: 'https://images.pexels.com/photos/7269547/pexels-photo-7269547.jpeg?auto=compress&cs=tinysrgb&w=600'}
    ];

    let currentCategory = 'all';
    let currentAudience = 'all';
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        
        const filtered = allProducts.filter(p => {
            const matchCategory = currentCategory === 'all' || p.category === currentCategory;
            const matchAudience = currentAudience === 'all' || p.audience === currentAudience;
            return matchCategory && matchAudience;
        });

        filtered.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-img"><img src="${product.img}" alt="${product.name}" loading="lazy"></div>
                <div class="product-info">
                    <div class="product-brand">${product.brand}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-bottom">
                        <div class="product-price">${product.price.toLocaleString()} ₽</div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">В корзину</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(category) {
        currentCategory = category;
        renderProducts();
    }

    function filterAudience(audience) {
        currentAudience = audience;
        currentCategory = 'all'; 
        renderProducts();
    }

    function addToCart(productId) {
        const existing = cart.find(item => item.id === productId);
        if (existing) {
            existing.qty += 1;
        } else {
            const product = allProducts.find(p => p.id === productId);
            cart.push({ ...product, qty: 1 });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCart();
        // Не открываем корзину автоматически, чтобы не мешать, но обновляем счетчик
    }

    function updateCart() {
        const cartItems = document.getElementById('cartItems');
        cartItems.innerHTML = '';
        
        let totalQty = 0;
        let totalPrice = 0;

        cart.forEach(item => {
            totalQty += item.qty;
            totalPrice += item.price * item.qty;
            cartItems.innerHTML += `
                <div class="cart-item">
                    <div class="product-img"><img src="${item.img}" alt="${item.name}" loading="lazy"></div>
                    <div class="cart-item-info">
                        <div>${item.name}</div>
                        <div style="color: #888; font-size: 12px;">${item.qty} шт.</div>
                    </div>
                    <div>${(item.price * item.qty).toLocaleString()} ₽</div>
                </div>
            `;
        });

        document.getElementById('cartCount').innerText = totalQty;
        document.getElementById('cartTotal').innerText = totalPrice.toLocaleString();
    }

    function toggleCart() {
        const panel = document.getElementById('cartPanel');
        if (panel.classList.contains('open')) {
            panel.classList.remove('open');
        } else {
            panel.classList.add('open');
            updateCart(); // Обновляем при открытии
        }
    }

    renderProducts();
    updateCart();
</script>

</body>
</html>
